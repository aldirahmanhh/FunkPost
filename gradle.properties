org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.5.2 is tested up to compileSdk 34; we intentionally build against 35.
android.suppressUnsupportedCompileSdk=35

# connectedAndroidTest uninstalls the app and its test APK when the run finishes, which also
# deletes app data (Room database + Tink keyset). Keep them installed so running tests on a
# device that holds real tokens cannot wipe them. Matches AGP BooleanOption
# android.injected.androidTest.leaveApksInstalledAfterRun.
android.injected.androidTest.leaveApksInstalledAfterRun=true
